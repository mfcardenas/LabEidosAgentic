[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eidos-platform"
version = "0.1.0"
description = "Plataforma Eidos: construye y mantiene interfaces a partir de entradas humanas con agentes verificados."
requires-python = ">=3.12"
license = { text = "Proprietary. All rights reserved. See LICENSE." }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
eidos = "eidos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eidos = ["catalog/*.json", "patterns/*.yaml", "policy/*.yaml", "guard/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
# B008: Body() en los argumentos es el idioma de FastAPI.
ignore = ["E731", "B008"]

[tool.ruff.lint.per-file-ignores]
# Los prompts son texto: las líneas largas son intencionadas.
"src/eidos/agents/__init__.py" = ["E501"]
